<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision CAPET SII IE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">

<!-- iOS : Safari ignore `display: standalone` du manifeste. Sans ces trois
     balises, l'app ajoutée à l'écran d'accueil s'ouvre AVEC la barre Safari,
     ce qui mange ~15 % de la hauteur utile sur un écran de téléphone. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAPET IE">
<link rel="apple-touch-icon" href="icons/icone-192.png">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="barre-haut">
  <span class="marque">CAPET SII·IE</span>
  <!-- L'icône est décorative : le bouton porte déjà son nom via aria-label. -->
  <button id="bascule-theme" aria-label="Changer de thème">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/>
    </svg>
  </button>
</header>

<main id="app" aria-live="polite"></main>

<!-- Trois destinations : sous la limite de 5 d'une barre d'onglets.
     Chaque lien garde son libellé sous l'icône (une icône seule serait
     ambiguë), et l'état actif est signalé par la couleur ET aria-current. -->
<nav class="barre-bas" aria-label="Navigation principale">
  <a href="#/reviser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="5" width="18" height="13" rx="2.5"/>
      <path d="M3 9.5h18"/>
    </svg>
    Réviser
  </a>
  <a href="#/priorites">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 20V11M12 20V5M19 20v-6"/>
    </svg>
    Priorités
  </a>
  <a href="#/reglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
      <circle cx="16" cy="7" r="2.2"/>
      <circle cx="10" cy="17" r="2.2"/>
    </svg>
    Réglages
  </a>
</nav>

<script src="vendor/katex/katex.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
